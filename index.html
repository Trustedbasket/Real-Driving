                     <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Real Driving - Pro Edition</title>
​<!-- Three.js & OBJ Loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
​<style>
body, html {
margin: 0; padding: 0; width: 100%; height: 100%;
overflow: hidden; background-color: #87CEEB;
touch-action: none; user-select: none; font-family: 'Arial', sans-serif;
}
​#game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
​/* START SCREEN */
#start-screen {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.95); z-index: 999;
display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#btn-start {
background: #10b981; color: white; border: none; padding: 18px 45px;
font-size: 24px; font-weight: bold; border-radius: 12px; cursor: pointer;
box-shadow: 0 5px 20px rgba(16, 185, 129, 0.5); text-transform: uppercase;
}
​/* PAUSE MENU MODAL */
#pause-menu {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.8); z-index: 100; display: none;
flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.menu-btn {
background: #334155; color: white; border: 2px solid #64748b;
padding: 12px 35px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 200px; text-align: center;
}
.menu-btn:active { background: #475569; }
​/* UI LAYER */
#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; }
​/* DASHBOARD & PAUSE BUTTON */
#dashboard {
position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
background: rgba(10, 15, 20, 0.85); border-bottom: 3px solid #38bdf8;
padding: 5px 20px; border-radius: 8px; color: white;
display: flex; gap: 15px; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
.speed-box span { color: #38bdf8; font-size: 24px; font-weight: 900;}
.gear-indicator span { color: #fbbf24; font-size: 22px; font-weight: 900;}
​#pause-btn {
width: 40px; height: 40px; border-radius: 50%; background: #ef4444; color: white; border: 2px solid #fff; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px #ef4444;
}
​/* GEAR SHIFTER */
  #gear-box {
position: absolute; top: 15px; right: 20px; background: rgba(15, 23, 42, 0.8);
padding: 5px; border-radius: 25px; display: flex; gap: 5px;
}
.gear-btn {
width: 40px; height: 40px; border-radius: 50%; background: #1e293b;
color: white; font-weight: bold; font-size: 16px; border: none; cursor: pointer;
}
#gear-p.active { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
#gear-r.active { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
#gear-d.active { background: #10b981; box-shadow: 0 0 10px #10b981; }
​/* STEERING */
#steering-wheel {
position: absolute; bottom: 20px; left: 20px; width: 130px; height: 130px;
background: radial-gradient(circle, #333 15%, transparent 20%, transparent 65%, #222 68%);
border: 10px solid #111; border-radius: 50%;
display: flex; justify-content: center; align-items: center;
}
#steering-center { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, #333, #111); border: 2px solid #444; }
​/* PEDALS */
#pedal-box { position: absolute; bottom: 20px; right: 20px; display: flex; align-items: flex-end; gap: 20px; }
.pedal {
background: linear-gradient(180deg, #94a3b8, #475569); border: 1px solid #cbd5e1;
border-radius: 6px; color: #0f172a; font-weight: 900; font-size: 13px;
display: flex; justify-content: center; align-items: center; border-bottom: 8px solid #1e293b;
}
#brake-pedal { width: 75px; height: 50px; }
#race-pedal { width: 50px; height: 105px; border-radius: 4px 15px 4px 15px; }
.pedal:active { transform: translateY(6px); border-bottom: 2px solid #1e293b; }
​#debug-log { position: absolute; top: 10px; left: 10px; color: red; font-weight: bold; background: rgba(255,255,255,0.9); padding: 5px; display: none; z-index: 100; border-radius: 4px; }
</style>
</head>
<body>
​<!-- START SCREEN -->
<div id="start-screen">
<h1 style="color:white; margin-bottom: 10px;">Real Driving</h1>
<p style="color:#94a3b8; margin-bottom: 30px;">Dr. Driving Web Edition</p>
<button id="btn-start" onclick="initGame()">PLAY GAME</button>
</div>
​<!-- PAUSE MENU -->
<div id="pause-menu">
<h2 style="color: white; margin-bottom: 10px;">GAME PAUSED</h2>
<button class="menu-btn" onclick="resumeGame()">RESUME</button>
<button class="menu-btn" onclick="exitGame()" style="background:#b91c1c; border-color:#dc2626;">EXIT</button>
</div>
​<!-- GAME UI -->
<div id="debug-log"></div>
<div id="game-canvas"></div>
​<div id="ui-layer">
<div id="dashboard">
<button id="pause-btn" onclick="pauseGame()">⏸</button>
<div class="speed-box"><span id="speed-text">0</span> km/h</div>
<div class="gear-indicator">Gear: <span id="gear-display">P</span></div>
</div>
​<div id="gear-box">
<button class="gear-btn active" id="gear-p" onclick="setMode('P')">P</button>
<button class="gear-btn" id="gear-r" onclick="setMode('R')">R</button>
<button class="gear-btn" id="gear-d" onclick="setMode('D')">D</button>
</div>
​<div id="steering-wheel"><div id="steering-center"></div></div>
​<div id="pedal-box">
<div class="pedal" id="brake-pedal">BRK</div>
<div class="pedal" id="race-pedal">ACC</div>
</div>
</div>
​<script>
let scene, camera, renderer, activeCarMesh;
let isPaused = false;
let speed = 0;
let gearMode = 'P';
​function initGame() {
const startScreen = document.getElementById('start-screen');
const uiLayer = document.getElementById('ui-layer');
const elem = document.documentElement;
​if (elem.requestFullscreen) {
elem.requestFullscreen().catch(() => {});
}
​if (screen.orientation && screen.orientation.lock) {
screen.orientation.lock('landscape').catch(() => {});
}
​startScreen.style.display = 'none';
uiLayer.style.display = 'block';
​if (!scene) setup3D();
}
​function pauseGame() {
isPaused = true;
document.getElementById('pause-menu').style.display = 'flex';
}
​function resumeGame() {
isPaused = false;
document.getElementById('pause-menu').style.display = 'none';
}
​function exitGame() {
if (document.exitFullscreen) {
document.exitFullscreen().catch(() => {});
}
location.reload(); // Restarts to start screen
}
​function setup3D() {
scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
​camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 7);
​renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('game-canvas').appendChild(renderer.domElement);
​scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
​const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshLambertMaterial({ color: 0x556B2F }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
​loadPlayerCar();
animate();
}
​function loadPlayerCar() {
const objPath = car00.obj;
const texPath = car00.png;
​const objLoader = new THREE.OBJLoader();
const textureLoader = new THREE.TextureLoader();
const debugLog = document.getElementById('debug-log');
​textureLoader.load(texPath, function(texture) {
objLoader.load(
objPath,
function (object) {
activeCarMesh = object;
activeCarMesh.traverse(function (child) {
if (child instanceof THREE.Mesh) {
child.material.map = texture;
}
});
activeCarMesh.scale.set(0.015, 0.015, 0.015);
activeCarMesh.position.set(0, 0, 0);
scene.add(activeCarMesh);
},
undefined,
function (error) {
debugLog.style.display = 'block';
debugLog.innerText = "Error: car00.obj not found in root!";
}
);
}, undefined, function(err) {
debugLog.style.display = 'block';
debugLog.innerText = "Error: car00.png not found in root!";
});
}
​function animate() {
requestAnimationFrame(animate);
if (!isPaused) {
if(activeCarMesh) activeCarMesh.rotation.y -= 0.005;
if(renderer) renderer.render(scene, camera);
}
}
​function setMode(mode) {
gearMode = mode;
document.querySelectorAll('.gear-btn').forEach(b => b.classList.remove('active'));
document.getElementById('gear-' + mode.toLowerCase()).classList.add('active');
document.getElementById('gear-display').innerText = mode;
}
​window.addEventListener('resize', () => {
if(camera && renderer) {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
});
</script>
</body>
</html>
